
<!-- SVG container: defines the logo's dimensions and coordinate system -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100">

  <!-- Dark navy background with rounded corners -->
  <rect width="100" height="100" rx="22"
        fill="#1B1B3A"/>

  <!-- Cream-coloured M logo -->
  <path d="M22 82 V34 L50 66 L78 34 V82"
        fill="none"
        stroke="#F6F3EC"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Orange dot above the M -->
  <circle cx="50" cy="26" r="9"
          fill="#E8502F"/>

</svg>
